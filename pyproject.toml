[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skald-kanban"
dynamic = ["version"]
description = "Track work from idea to release, in Markdown, in your repo, with your coding agents: an agent CLI and a local board over story files in git."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vitund AI" }]
keywords = ["kanban", "backlog", "agents", "markdown", "git"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Vitund-AI/skald"
Source = "https://github.com/Vitund-AI/skald"
Issues = "https://github.com/Vitund-AI/skald/issues"

[project.scripts]
skald = "skald.cli:main"
git-skald = "skald.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skald = ["web/*.html", "templates/*.md"]

[tool.setuptools.dynamic]
version = { attr = "skald.__version__" }

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, and the bandit-derived S rules. E501 is off: the code
# wraps prose at 100 and tables wider, and the length rule would drown the rest.
select = ["E", "F", "W", "B", "S"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# git runs as an argument list, never through a shell; the executable is "git" by design.
"src/skald/gitutil.py" = ["S603", "S607"]
"src/skald/importer.py" = ["S603", "S607"]
"src/skald/audit.py" = ["S603", "S607"]
"src/skald/server.py" = ["S104", "S603", "S607"]  # --host 0.0.0.0 opens the board to the LAN on purpose
"src/skald/cli.py" = ["S603", "S607"]
"examples/**" = ["S603", "S607"]
# Tests drive the CLI and git as subprocesses, open localhost URLs, and bind 0.0.0.0 deliberately.
"tests/**" = ["S101", "S104", "S310", "S603", "S607"]
