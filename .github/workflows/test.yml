name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # jobs that write say so themselves

jobs:
  # A documentation-only change skips the matrix. The skip is a job condition, not a path
  # filter on the workflow: a filtered-out workflow leaves a required check "expected"
  # forever, while a skipped job reports as skipped and satisfies it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable base; running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # merge-base, so a base branch that moved on since the branch was cut does not count
          changed=$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)
          printf '%s\n' "$changed"
          echo "docs_only=$(printf '%s\n' "$changed" | python3 scripts/docs_only.py)" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff==0.15.8
      - run: ruff check src tests examples scripts

  unittest:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run tests
        run: python -m unittest -v
      - name: Build wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel
